name: Project

# New issue -> added to the project, issue closed -> "Done"
# PR opened -> "In Review", PR merged -> "To Test" (the issue stays open with "Refs #n": the PO closes it after testing)
on:
  issues:
    types: [opened, closed]
  pull_request:
    types: [opened, reopened, closed]

env:
  PROJECT_URL: https://github.com/users/Miisterone/projects/5

jobs:
  add-issue:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: ${{ env.PROJECT_URL }}
          github-token: ${{ secrets.PROJECT_TOKEN }}

  status:
    if: >-
      (github.event_name == 'issues' && github.event.action == 'closed') ||
      (github.event_name == 'pull_request' && (github.event.action != 'closed' || github.event.pull_request.merged))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node .github/scripts/project-status.mjs
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_OWNER: Miisterone
          PROJECT_NUMBER: 5
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BRANCH: ${{ github.head_ref }}
          STATUS: ${{ github.event_name == 'issues' && 'Done' || (github.event.action == 'closed' && 'To Test' || 'In Review') }}
