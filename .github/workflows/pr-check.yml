name: PR check

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

jobs:
  naming:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          # The issue number is mandatory: the Project workflow uses it to update the issue status
          regex='^((feature|fix|hotfix)/[0-9]+-[a-z0-9]+(-[a-z0-9]+)*|release/[0-9]+\.[0-9]+\.[0-9]+|develop)$'
          if [[ ! "$BRANCH" =~ $regex ]]; then
            echo "::error::Branch '$BRANCH' must look like feature/<issue>-<desc>, fix/<issue>-<desc>, hotfix/<issue>-<desc> or release/x.y.z (issue number, desc in English, lowercase, words separated by dashes)"
            exit 1
          fi

      - name: PR title (Conventional Commits)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          regex='^(feat|fix|refactor|docs|test|ci|chore)(\((frontend|backend|database|infra)\))?: .+'
          if [[ ! "$TITLE" =~ $regex ]]; then
            echo "::error::Title '$TITLE' must look like 'feat(frontend): add login page'"
            exit 1
          fi

  labels:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/labeler@v5
