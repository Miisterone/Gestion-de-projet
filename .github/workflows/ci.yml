name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# Cancels the previous run if a new commit is pushed on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: API documentation and error catalogue are up to date
        run: |
          npm run docs
          git diff --exit-code docs/API.md ERRORS.md || (echo "::error::Run 'npm run docs' and commit docs/API.md and ERRORS.md" && exit 1)

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: localloop
          POSTGRES_PASSWORD: localloop
          POSTGRES_DB: localloop_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U localloop" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit and integration tests
        run: npm test

  storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Storybook builds
        run: npm run build-storybook -w frontend -- --quiet

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: localloop
          POSTGRES_PASSWORD: localloop
          POSTGRES_DB: localloop_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U localloop" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: E2E tests (800x600)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
