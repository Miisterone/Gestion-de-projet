name: EPIC
description: Grande fonctionnalité, découpée en sous-issues front et back
title: "[EPIC] "
labels: [epic]
body:
  - type: textarea
    id: goal
    attributes:
      label: Objectif
      description: En tant que <utilisateur>, je veux <action> afin de <bénéfice>.
    validations:
      required: true
  - type: dropdown
    id: persona
    attributes:
      label: Persona
      description: Persona(s) servi(s), voir docs/PERSONAS.md. Ajouter aussi le label persona:* correspondant.
      multiple: true
      options:
        - Gérard (800×600, connexion lente)
        - Inès (stats et badges)
        - Chloé (vie privée)
        - Karim (événements d'association)
        - Aucun (tâche technique)
  - type: textarea
    id: criteria
    attributes:
      label: Critères d'acceptation
      description: Un critère par règle produit, au format Étant donné / Quand / Alors (voir la Definition of Ready dans CONTRIBUTING.md).
      value: |
        - [ ] Étant donné … quand … alors …
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Cas d'erreur attendus
      description: Situation et code du catalogue (ERRORS.md), ou « nouveau code à créer ».
      value: |
        - … → `LL_…`
  - type: markdown
    attributes:
      value: Après création, ajouter les tâches front et back avec **Create sub-issue**.
