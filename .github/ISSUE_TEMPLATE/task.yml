name: Tâche
description: Tâche front ou back, rattachée à une EPIC
body:
  - type: dropdown
    id: scope
    attributes:
      label: Partie
      options: [frontend, backend, database, infra]
    validations:
      required: true
  - type: dropdown
    id: persona
    attributes:
      label: Persona
      description: Persona(s) servi(s), voir docs/PERSONAS.md. Ajouter aussi le label persona:* correspondant.
      multiple: true
      options:
        - Gérard (800×600, connexion lente)
        - Inès (stats et badges)
        - Chloé (vie privée)
        - Karim (événements d'association)
        - Aucun (tâche technique)
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Critères d'acceptation
      description: Un critère par règle produit, au format Étant donné / Quand / Alors (voir la Definition of Ready dans CONTRIBUTING.md).
      value: |
        - [ ] Étant donné … quand … alors …
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Cas d'erreur attendus
      description: Situation et code du catalogue (ERRORS.md), ou « nouveau code à créer ».
      value: |
        - … → `LL_…`
  - type: textarea
    id: render
    attributes:
      label: Rendu attendu en 800×600
      description: Tâche front uniquement. Maquette, capture ou description de l'écran de Gérard (800×600, sans défilement horizontal).
  - type: textarea
    id: blocked
    attributes:
      label: Dépendances
      description: Issues qui doivent être faites avant. Les ajouter aussi en lien Blocked by, et les retirer quand elles ne sont plus vraies.
